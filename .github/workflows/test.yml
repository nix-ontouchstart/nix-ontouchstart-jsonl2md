# https://github.com/actions/runner-images/blob/main/images/ubuntu/Ubuntu2604-Arm64-Readme.md

name: test

on: push

jobs:
  test:

    runs-on: ubuntu-26.04-arm

    steps:
    - uses: actions/checkout@v7
    - name: Platform
      run: uname -a
    - name: install nix from https://github.com/DeterminateSystems/nix-installer/releases/download/v3.23.3/nix-installer.sh
      run: cat nix-installer.sh | sh -s -- install --no-confirm
    - name: nix version
      run: nix --version
    - name: rust/cargo versions
      run: |
        nix develop --command cargo --version
        nix develop --command rustc --version
    - name: nix flake show
      run: nix flake show
    - name: make test
      run: make test
